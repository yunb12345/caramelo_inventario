name: Backup base de datos

# Dump diario de produccion. Los artifacts de GitHub se guardan 30 dias.
# No reemplaza backups de largo plazo: para eso, Supabase Pro o un bucket propio.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    name: pg_dump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pg_dump tiene que ser >= version del servidor, por eso el cliente 17
      # del repositorio oficial de PostgreSQL (Ubuntu trae el 16).
      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Verificar conexion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Falta el secreto DATABASE_URL." >&2
            exit 1
          fi
          # libpq no entiende sslmode=no-verify (es de node-postgres);
          # para libpq, require ya cifra sin verificar el certificado.
          PG_URL="${DATABASE_URL//sslmode=no-verify/sslmode=require}"
          psql "$PG_URL" -v ON_ERROR_STOP=1 -c "select current_database() as db, version() as server"

      - name: Generar backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/backup-db.sh backups 0

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: caramelo-backup-${{ github.run_number }}
          path: backups/*.dump
          retention-days: 30
          if-no-files-found: error
